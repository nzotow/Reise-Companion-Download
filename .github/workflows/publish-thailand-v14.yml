name: Publish Thailand V14

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-thailand-v14.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download Thailand V14 artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-a300-81f4-8510-8d6eeaadbf6b/raw?se=2026-08-31T20%3A21%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=db763542-4d1c-5421-bc9c-d891a86acecd&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T09%3A38%3A45Z&ske=2026-09-01T09%3A38%3A45Z&sks=b&skv=2026-02-06&sig=6/cKiL7XnEkoALeImfySaIpJD0vB3dgyQYOlQP5Swwo%3D' -o artifact.zip
          unzip -o artifact.zip
          test -f Thailand-Khao-Lak-2026-Magazin-v14.reise
      - name: Publish public Thailand release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view thailand-v14 >/dev/null 2>&1; then
            gh release upload thailand-v14 Thailand-Khao-Lak-2026-Magazin-v14.reise --clobber
          else
            gh release create thailand-v14 Thailand-Khao-Lak-2026-Magazin-v14.reise --title 'Thailand Khao Lak 2026 – V14' --notes 'Reisepaket für den Reise-Companion.'
          fi
